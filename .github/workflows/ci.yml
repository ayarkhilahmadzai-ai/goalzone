name: Validate GoalZone

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Match identity regression tests
        run: npm test
      - name: ESLint check
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Smoke test built website over HTTP
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/goalzone-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o /tmp/goalzone-index.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/goalzone-index.html
          grep -q '<div id="root"></div>' /tmp/goalzone-index.html
          grep -q '/assets/' /tmp/goalzone-index.html
